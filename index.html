<title>資產札記</title>
<style>
  /* ============ Typography: 易讀優先 ============ */
  /* Noto Sans TC = 中文清晰好讀;Inter = 英數比 system font 統一;
     JetBrains Mono = 數字專用,等寬對齊好看 */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0e0d0b;
    --bg-elev: #1a1815;
    --bg-elev-2: #24211d;
    --line: #322d27;
    --line-soft: #221f1b;
    --ink: #f5f1e8;
    --ink-mute: #b5ad9f;
    --ink-dim: #7a7268;
    --gold: #d4b074;
    --gold-soft: #9a8252;
    --green: #82b078;
    --red: #d18078;
    --blue: #78a8d1;
    --purple: #a78bca;

    --tc: 'Noto Sans TC', system-ui, sans-serif;
    --en: 'Inter', system-ui, sans-serif;
    --num: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: var(--tc);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 40% at 50% -10%, rgba(212,176,116,0.06), transparent 60%),
      var(--bg);
    padding-bottom: 90px;
    user-select: none;
    font-size: 15px;
    line-height: 1.5;
  }
  input { user-select: text; }
  button { font-family: inherit; cursor: pointer; }
  input, button { -webkit-appearance: none; appearance: none; }

  /* 數字統一用等寬字 */
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; }

  .app { max-width: 480px; margin: 0 auto; padding: 0 18px; }

  /* ============ Login screen ============ */
  .login-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background:
      radial-gradient(ellipse 80% 50% at 50% 30%, rgba(212,176,116,0.10), transparent 60%),
      var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-overlay.hidden { display: none; }
  .login-box {
    width: 100%; max-width: 360px;
    text-align: center;
  }
  .login-logo {
    font-family: var(--tc); font-size: 24px; font-weight: 700;
    color: var(--gold); letter-spacing: 0.05em; margin-bottom: 8px;
  }
  .login-logo .en {
    display: block; font-family: var(--en); font-size: 11px;
    color: var(--ink-dim); letter-spacing: 0.3em;
    font-weight: 500; text-transform: uppercase; margin-top: 4px;
  }
  .login-divider {
    width: 40px; height: 1px; background: var(--gold-soft);
    margin: 28px auto; opacity: 0.5;
  }
  .login-prompt {
    color: var(--ink-mute); font-size: 13px;
    margin-bottom: 16px; letter-spacing: 0.05em;
  }
  .login-input {
    width: 100%; background: var(--bg-elev); border: 1px solid var(--line);
    color: var(--ink); padding: 14px 16px; border-radius: 12px;
    font-family: var(--num); font-size: 18px; font-weight: 500;
    text-align: center; letter-spacing: 0.15em;
    margin-bottom: 12px;
  }
  .login-input:focus { outline: none; border-color: var(--gold); }
  .login-input.error {
    border-color: var(--red);
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .login-btn {
    width: 100%; background: var(--gold); color: var(--bg);
    border: none; border-radius: 12px; padding: 14px;
    font-family: var(--tc); font-size: 15px; font-weight: 700;
    letter-spacing: 0.1em;
    box-shadow: 0 4px 16px rgba(212,176,116,0.18);
  }
  .login-btn:active { transform: scale(0.98); }
  .login-error {
    color: var(--red); font-size: 12px; margin-top: 10px;
    min-height: 18px; font-family: var(--tc);
  }
  .login-note {
    color: var(--ink-dim); font-size: 11px; margin-top: 24px;
    line-height: 1.6; letter-spacing: 0.05em;
  }

  /* ============ Collapsible group ============ */
  .group-card {
    background: var(--bg-elev); border: 1px solid var(--line-soft);
    border-radius: 12px; margin-bottom: 6px;
    overflow: hidden;
  }
  .group-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .group-head:active { background: var(--bg-elev-2); }
  .group-head .left {
    display: flex; align-items: center; gap: 10px;
  }
  .group-head .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .group-head .dot.green { background: var(--green); }
  .group-head .dot.red { background: var(--red); }
  .group-head .dot.gold { background: var(--gold); }
  .group-head .dot.blue { background: var(--blue); }
  .group-head .dot.gray { background: var(--ink-dim); }
  .group-head .label {
    font-family: var(--tc); font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .group-head .count {
    font-family: var(--num); font-size: 10px; color: var(--ink-dim);
    margin-left: 6px;
  }
  .group-head .right {
    display: flex; align-items: center; gap: 10px;
  }
  .group-head .total-val {
    font-family: var(--num); font-size: 15px; font-weight: 600; color: var(--ink);
  }
  .group-head .total-val.neg { color: var(--red); }
  .group-head .total-val.muted { color: var(--ink-mute); }
  .group-head .delta {
    font-family: var(--num); font-size: 10px; color: var(--ink-dim);
  }
  .group-head .delta.up { color: var(--green); }
  .group-head .delta.down { color: var(--red); }
  .group-head .arrow {
    color: var(--ink-dim); font-size: 12px;
    transition: transform 0.2s;
    margin-left: 4px;
  }
  .group-card.expanded .group-head .arrow { transform: rotate(90deg); }
  .group-body {
    display: none;
    border-top: 1px solid var(--line-soft);
    padding: 6px 8px 8px;
    background: var(--bg);
  }
  .group-card.expanded .group-body { display: block; }
  .group-body .acc-row {
    background: transparent; border: none;
    padding: 8px 10px;
    border-radius: 8px;
  }
  .group-body .acc-row + .acc-row {
    border-top: 1px solid var(--line-soft);
  }

  /* Hero stat tiles inside dashboard */
  .key-tile {
    background: var(--bg-elev); border: 1px solid var(--line-soft);
    border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 6px;
  }
  .key-tile .lbl {
    font-family: var(--tc); font-size: 13px; color: var(--ink-mute);
    flex: 1;
  }
  .key-tile .lbl .sub {
    display: block; font-family: var(--num); font-size: 10px;
    color: var(--ink-dim); margin-top: 2px;
  }
  .key-tile .val {
    font-family: var(--num); font-size: 16px; font-weight: 600;
    color: var(--ink); text-align: right;
  }
  .key-tile .val.green { color: var(--green); }
  .key-tile .val.red { color: var(--red); }
  .key-tile .val.gold { color: var(--gold); }
  .key-tile .val .u {
    font-family: var(--tc); font-size: 11px; color: var(--ink-mute);
    margin-left: 2px;
  }

  /* ============ Top bar ============ */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 18px 14px;
    max-width: 480px; margin: 0 auto;
  }
  .topbar .brand {
    font-family: var(--tc); font-size: 17px; font-weight: 700;
    letter-spacing: 0.05em; color: var(--gold);
  }
  .topbar .brand .en {
    font-family: var(--en); font-size: 11px; color: var(--ink-dim);
    margin-left: 8px; letter-spacing: 0.15em; font-weight: 500; text-transform: uppercase;
  }
  .topbar .menu-btn {
    background: transparent; border: 1px solid var(--line); color: var(--ink-mute);
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .topbar .menu-btn:active { background: var(--bg-elev); }

  /* ============ Tabs ============ */
  .tabs {
    display: flex; gap: 4px;
    background: var(--bg-elev); border-radius: 100px;
    padding: 4px; margin: 0 18px 18px;
    max-width: 480px; margin-left: auto; margin-right: auto;
    border: 1px solid var(--line-soft);
  }
  .tab {
    flex: 1; background: transparent; border: none; color: var(--ink-mute);
    padding: 10px 6px; border-radius: 100px;
    font-family: var(--tc); font-size: 13px; font-weight: 600;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .tab.active { background: var(--bg-elev-2); color: var(--gold); border: 1px solid var(--line); }

  /* ============ Page ============ */
  .page { display: none; animation: fadeIn 0.25s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ============ Hero ============ */
  .hero {
    background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 14px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    opacity: 0.5;
  }
  .hero .label {
    font-size: 11px; letter-spacing: 0.25em; color: var(--ink-dim);
    text-transform: uppercase; margin-bottom: 6px;
    font-family: var(--en); font-weight: 600;
  }
  .hero .total {
    font-family: var(--num); font-size: 44px; font-weight: 600; line-height: 1.05;
    color: var(--ink); letter-spacing: -0.02em;
  }
  .hero .total .unit {
    font-size: 16px; color: var(--ink-mute); margin-left: 8px;
    font-family: var(--tc); font-weight: 400;
  }
  .hero .delta {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 10px; padding: 4px 10px;
    background: rgba(130,176,120,0.10); border: 1px solid rgba(130,176,120,0.24);
    border-radius: 100px;
    font-family: var(--num); font-size: 12px; font-weight: 500; color: var(--green);
  }
  .hero .delta.neg { background: rgba(209,128,120,0.10); border-color: rgba(209,128,120,0.24); color: var(--red); }
  .hero .delta.zero { background: rgba(181,173,159,0.08); border-color: rgba(181,173,159,0.18); color: var(--ink-mute); }
  .hero .date {
    font-family: var(--num); font-size: 11px; color: var(--ink-dim);
    margin-top: 12px; letter-spacing: 0.1em;
  }

  /* ============ Stat grid ============ */
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    background: var(--bg-elev); border: 1px solid var(--line-soft);
    border-radius: 12px; padding: 14px;
  }
  .stat .label {
    font-size: 11px; letter-spacing: 0.15em; color: var(--ink-dim);
    text-transform: uppercase; margin-bottom: 4px;
    font-family: var(--en); font-weight: 600;
  }
  .stat .label .zh { font-family: var(--tc); letter-spacing: 0.1em; margin-left: 6px; font-weight: 400; }
  .stat .val {
    font-family: var(--num); font-size: 22px; font-weight: 600;
    color: var(--ink); line-height: 1.1;
  }
  .stat .val.small { font-size: 18px; }
  .stat .val .u { font-size: 11px; color: var(--ink-mute); margin-left: 4px; font-family: var(--tc); font-weight: 400; }
  .stat .sub { font-size: 11px; color: var(--ink-mute); margin-top: 4px; font-family: var(--num); }
  .stat.accent .val { color: var(--gold); }

  /* ============ Section ============ */
  .section-title {
    font-family: var(--tc);
    font-size: 16px; font-weight: 700; color: var(--ink);
    margin: 22px 0 10px; letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title .en {
    font-family: var(--en); font-size: 10px; color: var(--ink-dim);
    letter-spacing: 0.2em; font-weight: 600; text-transform: uppercase;
  }
  .section-title .count { margin-left: auto; font-family: var(--num); font-size: 11px; color: var(--ink-dim); font-weight: 400; }
  .section-title.minor { font-size: 13px; color: var(--ink-mute); margin: 18px 0 8px; }

  /* ============ Account row ============ */
  .acc-list { display: flex; flex-direction: column; gap: 5px; }
  .acc-row {
    background: var(--bg-elev); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .acc-row .name { font-size: 14px; color: var(--ink); }
  .acc-row .val { font-family: var(--num); font-size: 14px; color: var(--ink); font-weight: 500; }
  .acc-row .val.neg { color: var(--red); }
  .acc-row .val .delta { font-size: 10px; color: var(--ink-dim); margin-left: 8px; font-weight: 400; }
  .acc-row .val .delta.up { color: var(--green); }
  .acc-row .val .delta.down { color: var(--red); }

  /* ============ Big add button ============ */
  .add-snapshot-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
    color: var(--bg);
    border: none; border-radius: 14px;
    padding: 16px;
    font-family: var(--tc); font-size: 15px; font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(212,176,116,0.18);
    transition: transform 0.1s;
  }
  .add-snapshot-btn:active { transform: scale(0.98); }
  .add-snapshot-btn .arrow { margin-left: 8px; }

  /* ============ Empty state ============ */
  .empty {
    text-align: center; padding: 50px 20px; color: var(--ink-mute);
  }
  .empty .icon { font-size: 42px; margin-bottom: 14px; opacity: 0.4; }
  .empty .title { font-family: var(--tc); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .empty .desc { font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
  .empty button {
    background: var(--gold); color: var(--bg); border: none;
    padding: 11px 22px; border-radius: 100px;
    font-family: var(--tc); font-weight: 700; font-size: 14px;
    letter-spacing: 0.08em;
  }

  /* ============ Snapshot input page ============ */
  .snap-header {
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .snap-header .month {
    font-family: var(--num); font-size: 22px; font-weight: 600;
    color: var(--gold); letter-spacing: 0.02em;
  }
  .snap-header .progress {
    font-family: var(--num); font-size: 12px; color: var(--ink-mute);
  }
  .progress-bar {
    height: 2px; background: var(--line-soft); border-radius: 2px;
    overflow: hidden; margin-bottom: 14px;
  }
  .progress-bar .fill {
    height: 100%; background: var(--gold);
    transition: width 0.3s;
  }

  .input-card {
    background: var(--bg-elev); border: 1px solid var(--line-soft);
    border-radius: 14px; padding: 16px;
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  .input-card.entered { border-color: rgba(212,176,116,0.32); }
  .input-card .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .input-card .name { font-family: var(--tc); font-size: 15px; font-weight: 600; color: var(--ink); }
  .input-card .cat-pill {
    font-family: var(--en); font-size: 9px; padding: 3px 7px;
    background: var(--bg-elev-2); color: var(--ink-mute);
    border-radius: 100px; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid var(--line-soft); font-weight: 600;
  }
  .input-card .last {
    font-family: var(--num); font-size: 12px; color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .input-card .last .v { color: var(--ink-mute); }
  .input-card .last .copy {
    background: transparent; border: 1px solid var(--line); color: var(--ink-mute);
    padding: 3px 9px; border-radius: 100px; font-size: 11px; margin-left: 8px;
    font-family: var(--tc); font-weight: 500;
  }
  .input-card .input-row {
    display: flex; align-items: center; gap: 8px;
  }
  .input-card input[type="number"], .input-card input[type="text"] {
    flex: 1;
    background: var(--bg); border: 1px solid var(--line);
    color: var(--ink); padding: 13px 14px; border-radius: 9px;
    font-family: var(--num); font-size: 17px; font-weight: 600;
    text-align: right;
    width: 100%;
  }
  .input-card input:focus { outline: none; border-color: var(--gold); }
  .input-card .unit-tag {
    font-family: var(--tc); font-size: 13px; color: var(--ink-mute);
    padding: 0 4px;
  }
  .input-card .auto-note {
    font-size: 11px; color: var(--gold-soft); margin-top: 6px;
    font-family: var(--tc); display: flex; align-items: center; gap: 5px;
  }

  /* ============ Save bar ============ */
  .save-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    padding: 18px;
    display: flex; justify-content: center; z-index: 50;
  }
  .save-bar .inner {
    max-width: 480px; width: 100%;
    display: flex; gap: 8px;
  }
  .save-bar button {
    flex: 1; padding: 15px;
    border: none; border-radius: 12px;
    font-family: var(--tc); font-size: 15px; font-weight: 700;
    letter-spacing: 0.08em;
  }
  .save-bar .cancel {
    background: var(--bg-elev); color: var(--ink-mute);
    border: 1px solid var(--line); flex: 0 0 28%;
  }
  .save-bar .save { background: var(--gold); color: var(--bg); }
  .save-bar .save:disabled { opacity: 0.4; }

  /* ============ History page ============ */
  .history-toolbar {
    background: var(--bg-elev); border: 1px solid var(--line-soft);
    border-radius: 14px; padding: 12px; margin-bottom: 12px;
  }
  .range-pills {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .pill {
    background: var(--bg-elev-2); border: 1px solid var(--line-soft);
    color: var(--ink-mute); padding: 7px 12px;
    border-radius: 100px; font-size: 12px; font-weight: 600;
    font-family: var(--tc); letter-spacing: 0.05em;
  }
  .pill.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }

  .metric-pills {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--line-soft);
  }

  .chart-card {
    background: var(--bg-elev); border: 1px solid var(--line-soft);
    border-radius: 14px; padding: 16px 12px 12px;
    margin-bottom: 12px;
  }
  .chart-title {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 6px 12px; gap: 12px;
  }

// ============================================================
// LOGIN GATE
// ============================================================
// 密碼: Sela1227 (SHA-256 hashed below)
// 注意:此為介面遮蔽,非真正安全機制。任何人查看原始碼可看到 hash,
// 雖然原始密碼難以反推,但仍建議搭配 Cloudflare Access 使用。
const PASSWORD_HASH = '2203bc4858946646c27e6930d6dd95b50f3e072873a5afcade1153259ef9a384';
const LOGIN_FLAG_KEY = 'ledger_logged_in';
const LOGIN_EXPIRY_DAYS = 30;  // 登入後 30 天內免重輸

async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hashBuf))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

function isLoggedIn() {
  try {
    const raw = localStorage.getItem(LOGIN_FLAG_KEY);
    if (!raw) return false;
    const flag = JSON.parse(raw);
    if (!flag.expiry || Date.now() > flag.expiry) {
      localStorage.removeItem(LOGIN_FLAG_KEY);
      return false;
    }
    return flag.ok === true;
  } catch (e) { return false; }
}

function setLoggedIn() {
  const expiry = Date.now() + LOGIN_EXPIRY_DAYS * 86400 * 1000;
  localStorage.setItem(LOGIN_FLAG_KEY, JSON.stringify({ ok: true, expiry }));
}

function logout() {
  localStorage.removeItem(LOGIN_FLAG_KEY);
  location.reload();
}

async function attemptLogin() {
  const input = document.getElementById('login-input');
  const errEl = document.getElementById('login-error');
  const val = input.value;
  if (!val) { errEl.textContent = '請輸入密碼'; return; }
  errEl.textContent = '';
  const h = await sha256(val);
  if (h === PASSWORD_HASH) {
    setLoggedIn();
    document.getElementById('login-overlay').classList.add('hidden');
    initApp();
  } else {
    input.classList.add('error');
    errEl.textContent = '密碼錯誤';
    setTimeout(() => input.classList.remove('error'), 500);
    input.value = '';
    input.focus();
  }
}

function showLoginGate() {
  // Hide the rest of the app while login is shown
  const overlay = document.getElementById('login-overlay');
  overlay.classList.remove('hidden');
  const input = document.getElementById('login-input');
  document.getElementById('login-btn').addEventListener('click', attemptLogin);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin();
  });
  setTimeout(() => input.focus(), 100);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn('load fail', e); }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }

function fmtWan(v, opts = {}) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  const s = abs.toLocaleString('en-US', { minimumFractionDigits: opts.dp ?? 1, maximumFractionDigits: opts.dp ?? 1 });
  return sign + s;
}
function fmtPct(v, dp = 1) { if (v == null || isNaN(v)) return '—'; return (v * 100).toFixed(dp) + '%'; }
function fmtMonth(date) { return date.replace(/-/g, '/').slice(0, 7); }
function fmtMonthShort(date) {
  const [y, m] = date.split('-');
  return y.slice(2) + '/' + m;
}

function getSortedSnapshots() { return [...DATA.snapshots].sort((a,b) => a.date.localeCompare(b.date)); }
function getLatestSnapshot() { const s = getSortedSnapshots(); return s.length ? s[s.length - 1] : null; }
function getPrevSnapshot(date) {
  return [...DATA.snapshots].filter(s => s.date < date).sort((a,b) => b.date.localeCompare(a.date))[0] || null;
}
function nextMonthDate() {
  const latest = getLatestSnapshot();
  let y, m;
  if (latest) {
    const [yr, mo] = latest.date.split('-').map(Number);
    y = yr; m = mo + 1;
    if (m > 12) { y++; m = 1; }
  } else { const d = new Date(); y = d.getFullYear(); m = d.getMonth() + 1; }
  return `${y}-${String(m).padStart(2, '0')}-01`;
}
function getActiveAccounts(filter = {}) {
  const showInactive = DATA.settings.show_inactive_accounts;
  return DATA.accounts.filter(a => {
    if (!a.active && !showInactive) return false;
    if (filter.owner && a.owner !== filter.owner) return false;
    return true;
  });
}

function computeStats(snapshot) {
  if (!snapshot) return null;
  const myAccs = DATA.accounts.filter(a => a.owner === 'me');
  let assets = 0, liab = 0, real_estate = 0, liquid = 0, normal_liab = 0;
  for (const a of myAccs) {
    const v = snapshot.balances[a.id];
    if (v == null) continue;
    // reference 類型(如雲象)只供公式引用,不計資產也不計負債
    if (a.side === 'reference') continue;
    if (a.side === 'asset') {
      assets += v;
      if (a.liquid) liquid += v;
      if (a.category === 'real_estate') real_estate += v;
    } else if (a.side === 'liability') {
      liab += v;  // 全部負債(用於負債比、總資產扣減)
      // 「正規貸款」= 排除 formula 類(mantou 是雲象的衍生計算,不是固定貸款)
      if (!(a.auto && a.auto.type === 'formula')) {
        normal_liab += v;
      }
    }
  }
  const total = assets + liab;
  const movable = assets - real_estate;
  const debtRatio = assets > 0 ? Math.abs(liab) / assets : 0;

  // === Excel 退休試算邏輯(V0.6.0)===
  // I9 美股 = TD + 永豐
  const us_stock = (snapshot.balances.td_us || 0) + (snapshot.balances.sinopac_us || 0);
  // I10 = D19 = 該月 yld
  const yld = (snapshot.qyld_yield != null) ? snapshot.qyld_yield : DATA.settings.qyld_yield;
  // I11 = (退休日 - TODAY) / 365
  const yearsToRetireDate = computeYearsToRetireDate(snapshot.date);
  // I12 = settings.retire_extension_years
  const retireExt = DATA.settings.retire_extension_years || 0;
  // I13 = 額外報酬
  const extraReturn = DATA.settings.extra_return_wan || 0;
  // I14 = 退休時美股價值
  const us_stock_at_retire = us_stock * Math.pow(1 + yld, yearsToRetireDate + retireExt);
  // I15 = 退休時勞退+定存(自提+績效+南非幣)
  const labor_at_retire = (snapshot.balances.labor_self || 0)
                        + (snapshot.balances.labor_perf || 0)
                        + (snapshot.balances.mega_zar || 0);

  // 月支出 F2 = 卡費 + 一菜雙石(snapshot)+ 貸款月繳合計
  const card = DATA.settings.monthly_card_wan || 0;
  const kid = (snapshot.monthly_kid_wan != null) ? snapshot.monthly_kid_wan : 0;
  const loan_pmt_total = computeTotalLoanPmt(snapshot);  // 萬/月
  const monthly_expense = card + kid + loan_pmt_total;

  // F1 薪水
  const salary = DATA.settings.salary_wan || 0;
  // F6 每月現金流
  const monthly_cashflow = salary - monthly_expense;

  // D6 離退休還差 = F2/I16*12 - I9 - I13
  const stillNeed = (yld > 0) ? (monthly_expense * 12 / yld - us_stock - extraReturn) : null;
  // D7 估算退休年 = LOG((D6+I9)/I9)/LOG(1+I10)
  let yearsToRetire = null;
  if (stillNeed != null && us_stock > 0 && yld > 0) {
    const ratio = (stillNeed + us_stock) / us_stock;
    if (ratio > 0) yearsToRetire = Math.log(ratio) / Math.log(1 + yld);
  }

  // I17 退休時每月可領(還債)= (I14+I13+D4 + H8/10000*12*(I11+I12)) * I16/12
  // 注意:H8/10000 已是萬,這裡用 loan_pmt_total
  const totalYearsToRetire = yearsToRetireDate + retireExt;
  // I17 用 normal_liab (Excel D4 = 只算正規貸款,不含公式衍生的 mantou)
  const monthly_at_retire_with_debt = (us_stock_at_retire + extraReturn + normal_liab + loan_pmt_total * 12 * totalYearsToRetire) * yld / 12;
  // I18 退休時每月可領(不還債)= (I14+I13)*I16/12
  const monthly_at_retire_no_debt = (us_stock_at_retire + extraReturn) * yld / 12;

  return {
    total, assets, liab, normal_liab, liquid, movable, real_estate, debtRatio,
    yld, us_stock, us_stock_at_retire, labor_at_retire,
    yearsToRetireDate, retireExt, totalYearsToRetire,
    monthly_expense, salary, monthly_cashflow, loan_pmt_total,
    stillNeed, yearsToRetire,
    monthly_at_retire_with_debt, monthly_at_retire_no_debt,
  };
}

// 算「快照日期 → 退休生日」的年數 (Excel I11 = (生日 - TODAY)/365)
// 注意:對歷史快照,用「快照日期」當 TODAY,這樣每月顯示是正確的歷史時間點
function computeYearsToRetireDate(snapshotDate) {
  const birthday = DATA.settings.retire_birthday;
  if (!birthday) return null;
  const target = new Date(birthday);
  const today = new Date(snapshotDate);
  if (isNaN(target.getTime()) || isNaN(today.getTime())) return null;
  return (target - today) / (365 * 24 * 60 * 60 * 1000);
}

// 算貸款月繳合計(萬/月),含設定裡的固定貸款 + 該月特斯拉車貸
function computeTotalLoanPmt(snapshot) {
  let total = 0;
  // 固定貸款月繳(從 settings)
  for (const loan of (DATA.settings.loan_pmt_wan || [])) {
    total += loan.wan_per_month || 0;
  }
  // 特斯拉車貸(逐月變動,存在 snapshot)
  if (snapshot.tesla_pmt_wan != null) total += snapshot.tesla_pmt_wan;
  return total;
}

function getAccountDelta(accId, currentDate) {
  const cur = DATA.snapshots.find(s => s.date === currentDate);
  const prev = getPrevSnapshot(currentDate);
  if (!cur || !prev) return null;
  const cv = cur.balances[accId], pv = prev.balances[accId];
  if (cv == null || pv == null) return null;
  return cv - pv;
}

function calcAmortizeNext(auto) {
  if (!auto || auto.type !== 'amortize') return null;
  const monthly_rate = auto.rate / 12;
  const total_months = auto.years_left * 12;
  if (total_months <= 0) return 0;
  const P = Math.abs(auto.last_balance_wan);
  const interest = P * monthly_rate;
  const factor = Math.pow(1 + monthly_rate, total_months);
  const pmt = P * monthly_rate * factor / (factor - 1);
  const principal_paid = pmt - interest;
  return -(P - principal_paid);
}

// ============================================================
// CHART RENDERER (純 SVG,不引外部 library)
// ============================================================
function renderLineChart(opts) {
  // opts: { points: [{date, value, label?}], color, height, fill, padding }
  const { points, color = 'var(--gold)', height = 180, fill = true } = opts;
  if (!points || points.length === 0) return '';

  const W = 380, H = height;
  const padL = 50, padR = 16, padT = 16, padB = 32;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const values = points.map(p => p.value);
  let minV = Math.min(...values);
  let maxV = Math.max(...values);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const range = maxV - minV;
  // 留白 10%
  const yMin = minV - range * 0.1;
  const yMax = maxV + range * 0.1;
  const yRange = yMax - yMin;

  const xAt = (i) => padL + (points.length === 1 ? innerW / 2 : (i / (points.length - 1)) * innerW);
  const yAt = (v) => padT + innerH - ((v - yMin) / yRange) * innerH;

  // path
  let pathD = '';
  let fillD = '';
  points.forEach((p, i) => {
    const x = xAt(i), y = yAt(p.value);
    pathD += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
  });
  if (fill && points.length > 1) {
    fillD = pathD + ` L ${xAt(points.length - 1)} ${padT + innerH} L ${xAt(0)} ${padT + innerH} Z`;
  }

  // y-axis ticks (4 levels)
  const ticks = 4;
  let yTicks = '';
  for (let i = 0; i <= ticks; i++) {
    const v = yMin + (yRange * i / ticks);
    const y = yAt(v);
    yTicks += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--line-soft)" stroke-width="1" stroke-dasharray="2 3" />`;
    yTicks += `<text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-family="JetBrains Mono" font-size="9" fill="var(--ink-dim)">${formatTickValue(v)}</text>`;
  }

  // x-axis labels (smart sampling)
  let xLabels = '';
  const numLabels = Math.min(points.length, 6);
  const step = Math.max(1, Math.floor((points.length - 1) / (numLabels - 1)));
  for (let i = 0; i < points.length; i += step) {
    const x = xAt(i);
    xLabels += `<text x="${x}" y="${H - 10}" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="var(--ink-dim)">${fmtMonthShort(points[i].date)}</text>`;
  }
  // last point always
  if ((points.length - 1) % step !== 0) {
    const x = xAt(points.length - 1);
    xLabels += `<text x="${x}" y="${H - 10}" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="var(--ink-dim)">${fmtMonthShort(points[points.length-1].date)}</text>`;
  }

  // dots
  let dots = '';
  points.forEach((p, i) => {
    if (i === points.length - 1) {
      dots += `<circle cx="${xAt(i)}" cy="${yAt(p.value)}" r="4" fill="${color}" />`;
      dots += `<circle cx="${xAt(i)}" cy="${yAt(p.value)}" r="8" fill="${color}" opacity="0.2" />`;
    }
  });

  const gradId = 'g_' + Math.random().toString(36).slice(2, 8);

  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${gradId}" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.25" />
          <stop offset="100%" stop-color="${color}" stop-opacity="0" />
        </linearGradient>
      </defs>
      ${yTicks}
      ${xLabels}
      ${fill ? `<path d="${fillD}" fill="url(#${gradId})" />` : ''}
      <path d="${pathD}" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      ${dots}
    </svg>
  `;
}

function formatTickValue(v) {
  if (Math.abs(v) >= 1000) return (v / 1000).toFixed(1) + 'K';
  if (Math.abs(v) >= 100) return v.toFixed(0);
  if (Math.abs(v) >= 10) return v.toFixed(1);
  return v.toFixed(2);
}

function renderMultiLineChart(opts) {
  // opts: { series: [{name, points: [{date, value}], color}], height, dates: [all dates] }
  const { series, height = 220, dates } = opts;
  if (!series.length || !dates.length) return '';

  const W = 380, H = height;
  const padL = 50, padR = 16, padT = 16, padB = 32;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  // Collect all values
  let allVals = [];
  series.forEach(s => s.points.forEach(p => { if (p.value != null) allVals.push(p.value); }));
  if (!allVals.length) return '';
  let minV = Math.min(...allVals), maxV = Math.max(...allVals);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const range = maxV - minV;
  const yMin = minV - range * 0.1, yMax = maxV + range * 0.1;
  const yRange = yMax - yMin;

  const dateIdx = {};
  dates.forEach((d, i) => dateIdx[d] = i);

  const xAt = (i) => padL + (dates.length === 1 ? innerW / 2 : (i / (dates.length - 1)) * innerW);
  const yAt = (v) => padT + innerH - ((v - yMin) / yRange) * innerH;

  let yTicks = '';
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (yRange * i / 4);
    const y = yAt(v);
    yTicks += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--line-soft)" stroke-width="1" stroke-dasharray="2 3" />`;
    yTicks += `<text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-family="JetBrains Mono" font-size="9" fill="var(--ink-dim)">${formatTickValue(v)}</text>`;
  }
  let xLabels = '';
  const step = Math.max(1, Math.floor((dates.length - 1) / 5));
  for (let i = 0; i < dates.length; i += step) {
    xLabels += `<text x="${xAt(i)}" y="${H - 10}" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="var(--ink-dim)">${fmtMonthShort(dates[i])}</text>`;
  }

  let paths = '';
  let dots = '';
  series.forEach(s => {
    let d = '';
    s.points.forEach((p, i) => {
      if (p.value == null) return;
      const idx = dateIdx[p.date];
      if (idx === undefined) return;
      const x = xAt(idx), y = yAt(p.value);
      d += (d === '' ? `M ${x} ${y}` : ` L ${x} ${y}`);
    });
    paths += `<path d="${d}" stroke="${s.color}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />`;
    // last dot
    const last = s.points.filter(p => p.value != null).slice(-1)[0];
    if (last) {
      const idx = dateIdx[last.date];
      dots += `<circle cx="${xAt(idx)}" cy="${yAt(last.value)}" r="3.5" fill="${s.color}" />`;
    }
  });

  return `
    <svg class="chart chart-tall" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${yTicks}
      ${xLabels}
      ${paths}
      ${dots}
    </svg>
  `;
}

let HISTORY_RANGE = '1Y';      // 3M / 6M / 1Y / 3Y / ALL
let HISTORY_METRIC = 'total';  // total / movable / liab / debtRatio
let HISTORY_SELECTED = null;   // 選中的某月快照 date

// Dashboard 帳戶分類折疊狀態(預設全部關閉)
let EXPANDED_GROUPS = new Set();
function toggleGroup(key) {
  if (EXPANDED_GROUPS.has(key)) EXPANDED_GROUPS.delete(key);
  else EXPANDED_GROUPS.add(key);
  renderDashboard();

function renderHistory() {
  const el = document.getElementById('history-content');
  const sorted = getSortedSnapshots();
  if (sorted.length < 1) {
    el.innerHTML = `<div class="empty"><div class="icon">⌖</div><div class="title">尚無歷史資料</div><div class="desc">儲存幾個月後就能看到走勢</div></div>`;
    return;
  }

  // Filter by range
  const ranges = { '3M': 3, '6M': 6, '1Y': 12, '3Y': 36, 'ALL': 9999 };
  const limit = ranges[HISTORY_RANGE];
  const filtered = sorted.slice(-limit);

  // Build metric points
  const metricDefs = {
    total:     { label: '總資產', color: 'var(--gold)', fn: s => computeStats(s).total },
    movable:   { label: '動產',   color: 'var(--blue)', fn: s => computeStats(s).movable },
    liab:      { label: '負債',   color: 'var(--red)',  fn: s => Math.abs(computeStats(s).liab) },
    debtRatio: { label: '負債比', color: 'var(--purple)', fn: s => computeStats(s).debtRatio * 100 },
  };

  const m = metricDefs[HISTORY_METRIC];
  const points = filtered.map(s => ({ date: s.date, value: m.fn(s) }));

  // Range pills
  const rangePillsHtml = ['3M', '6M', '1Y', '3Y', 'ALL'].map(r =>
    `<button class="pill ${HISTORY_RANGE === r ? 'active' : ''}" onclick="setHistoryRange('${r}')">${r}</button>`
  ).join('');
  // Metric pills
  const metricPillsHtml = Object.entries(metricDefs).map(([key, def]) =>
    `<button class="pill ${HISTORY_METRIC === key ? 'active' : ''}" onclick="setHistoryMetric('${key}')">${def.label}</button>`
  ).join('');

  // Stats over the selected range
  const rangeFirst = points[0].value;
  const rangeLast = points[points.length-1].value;
  const rangeChange = rangeLast - rangeFirst;
  const rangePct = rangeFirst !== 0 ? rangeChange / rangeFirst : 0;
  const rangeMin = Math.min(...points.map(p => p.value));
  const rangeMax = Math.max(...points.map(p => p.value));

  // History list (each month, latest first)
  const reverseSorted = [...sorted].reverse();
  let listHtml = '';
  for (let i = 0; i < reverseSorted.length; i++) {
    const s = reverseSorted[i];
    const next = reverseSorted[i + 1]; // older
    const stat = computeStats(s);
    const prevStat = next ? computeStats(next) : null;
    const d = prevStat ? stat.total - prevStat.total : null;
    const dCls = d == null ? '' : (d > 0 ? 'up' : (d < 0 ? 'down' : ''));
    const dSign = d == null ? '' : (d > 0 ? '+' : '');
    const isActive = HISTORY_SELECTED === s.date;
    listHtml += `
      <div class="hist-row ${isActive ? 'active' : ''}">
        <div class="month-lbl">${fmtMonth(s.date)}</div>
        <div class="total-lbl">${fmtWan(stat.total)} 萬</div>
        <div class="delta-lbl ${dCls}">${d != null ? dSign + fmtWan(d, {dp:1}) : '—'}</div>

let SNAP_DRAFT = null;

function goToSnapshot() {
  const date = nextMonthDate();
  const prev = getLatestSnapshot();
  const balances = {};
  const autoApplied = {};
  for (const a of getActiveAccounts()) {
    let v = prev ? prev.balances[a.id] : null;
    if (a.auto && a.auto.type === 'amortize' && prev && prev.balances[a.id] != null) {
      const updated = { ...a.auto, last_balance_wan: prev.balances[a.id] };
      v = calcAmortizeNext(updated);
      autoApplied[a.id] = 'amortize';
    }
    balances[a.id] = v;
  }
  // formula 類的 auto:用當前 balances 算(必須在所有依賴都填好後算,先給個初值)
  recomputeFormulas(balances, autoApplied);

  // QYLD 預填:用上月的值(Sela 自己當月會去查實際近五年年化)
  const qyld_yield = prev && prev.qyld_yield != null ? prev.qyld_yield : DATA.settings.qyld_yield;

  SNAP_DRAFT = {
    date, balances, prevBalances: prev ? prev.balances : {},
    autoApplied, isEdit: false,
    qyld_yield,
    prevQyld: prev ? prev.qyld_yield : null,
    monthly_kid_wan: prev && prev.monthly_kid_wan != null ? prev.monthly_kid_wan : null,
    prevKid: prev ? prev.monthly_kid_wan : null,
    tesla_pmt_wan: prev && prev.tesla_pmt_wan != null ? prev.tesla_pmt_wan : null,
    prevTesla: prev ? prev.tesla_pmt_wan : null,
  };
  renderSnapshot();
  switchPage('snapshot');
}

// 計算所有 formula 類 auto 的值,寫回 balances
// 目前只支援 expression: '-yunxiang/15' 這類「-某ID/數字」的簡單格式
// 「新增資產表」時用,編輯舊月份時不用(舊資料是既定事實)
function recomputeFormulas(balances, autoApplied) {
  for (const a of DATA.accounts) {
    if (!a.auto || a.auto.type !== 'formula') continue;
    const expected = computeFormulaExpected(a, balances);
    if (expected == null) {
      balances[a.id] = null;
      continue;
    }
    balances[a.id] = expected;
    autoApplied[a.id] = 'formula';
  }
}

// 給某個 formula 帳戶,從現有 balances 算出「期望值」
// 不修改 balances,只回傳數字(或 null 代表依賴缺失/解析失敗)
// 用途:(1) recomputeFormulas 寫入用 (2) 編輯模式顯示「期望 vs 實際」對帳
function computeFormulaExpected(account, balances) {
  if (!account.auto || account.auto.type !== 'formula') return null;
  const m = account.auto.expression.match(/^(-?)(\w+)\s*([/*])\s*([\d.]+)$/);
  if (!m) return null;
  const [, sign, refId, op, numStr] = m;
  const ref = balances[refId];
  if (ref == null || isNaN(ref)) return null;
  const num = parseFloat(numStr);
  let result = op === '/' ? ref / num : ref * num;
  if (sign === '-') result = -result;
  return +result.toFixed(4);
}

  const inputCount = accs.filter(a => !(a.auto && a.auto.type === 'formula')).length;
  const enteredCount = accs.filter(a =>
    !(a.auto && a.auto.type === 'formula') &&
    SNAP_DRAFT.balances[a.id] != null &&
    !isNaN(SNAP_DRAFT.balances[a.id])
  ).length;
  const pct = (enteredCount / inputCount) * 100;

  const groups = [
    { key: 'me', label: '我的資產與負債' },
    { key: 'dora', label: 'Dora' },
    { key: 'leo', label: 'Leo' },
    { key: 'aaron', label: 'Aaron' },
    { key: 'jinghan', label: '景翰' },
  ];

  let cardsHtml = '';
  for (const g of groups) {
    const groupAccs = accs.filter(a => a.owner === g.key);
    if (!groupAccs.length) continue;
    cardsHtml += `<div class="section-title" style="font-size: 15px; margin-top: 22px;">${g.label}</div>`;
    for (const a of groupAccs) {
      const last = SNAP_DRAFT.prevBalances[a.id];
      const cur = SNAP_DRAFT.balances[a.id];
      const autoMode = SNAP_DRAFT.autoApplied[a.id]; // 'amortize' | 'formula' | falsy
      const entered = cur != null && !isNaN(cur);
      const isFormula = a.auto && a.auto.type === 'formula';
      // formula 帳戶在「新增」模式自動算且鎖定;「編輯」模式可手改但顯示驗證資訊
      const formulaLocked = isFormula && !SNAP_DRAFT.isEdit;

      let noteHtml = '';
      if (formulaLocked) {
        noteHtml = `<div class="auto-note">⚙ 自動計算:${a.auto.expression} · 不可手改</div>`;
      } else if (isFormula && SNAP_DRAFT.isEdit) {
        // 編輯模式:算出公式期望值,跟實際值比對
        const expected = computeFormulaExpected(a, SNAP_DRAFT.balances);
        if (expected != null && cur != null) {
          const diff = Math.abs(expected - cur);
          if (diff < 0.01) {
            noteHtml = `<div class="auto-note" style="color:var(--green);">✓ 公式驗證:期望 ${fmtWan(expected, {dp:4})} ≈ 實際 ${fmtWan(cur, {dp:4})}</div>`;
          } else {
            noteHtml = `<div class="auto-note" style="color:var(--red);">⚠ 公式不符:期望 ${fmtWan(expected, {dp:2})} vs 實際 ${fmtWan(cur, {dp:2})} (差 ${fmtWan(diff, {dp:2})})</div>`;
          }
        } else if (expected != null && cur == null) {
          noteHtml = `<div class="auto-note" style="color:var(--ink-dim);">公式期望值 ${fmtWan(expected, {dp:2})}(本月實際未填)</div>`;
        }
      } else if (autoMode === 'amortize') {
        noteHtml = `<div class="auto-note">⚙ 自動攤還 · 可手動覆寫</div>`;
      }

      cardsHtml += `
        <div class="input-card ${entered ? 'entered' : ''}" data-acc="${a.id}">
          <div class="head">
            <div class="name">${a.name}</div>
            <div class="cat-pill">${a.category}</div>
          </div>
          <div class="last">
            上月: <span class="v num">${last != null ? fmtWan(last, {dp:2}) : '—'}</span> 萬
            ${last != null && !formulaLocked ? `<button class="copy" onclick="copyLast('${a.id}')">沿用</button>` : ''}
          </div>
          <div class="input-row">
            <input type="number" inputmode="decimal" step="any"
                   value="${cur != null ? cur : ''}" placeholder="0.0"
                   data-acc-input="${a.id}" onfocus="this.select()"
                   ${formulaLocked ? 'readonly style="color:var(--gold-soft);background:var(--bg-elev-2);"' : ''} />
            <span class="unit-tag">萬</span>
          </div>
          ${noteHtml}
        </div>`;
    }
  }

  // QYLD 輸入區(放在最頂)
  const qyldHtml = `
    <div class="input-card" style="border-color: rgba(106,154,201,0.3);">
      <div class="head">
        <div class="name">QYLD 年化報酬率</div>
        <div class="cat-pill" style="background:rgba(106,154,201,0.15);color:var(--blue);">YIELD</div>

        <input type="number" inputmode="decimal" step="0.0001"

      </div>
      <div class="auto-note" style="color:var(--blue);">輸入該日 QYLD 近五年含息年化(例 0.0739)</div>

    <div class="input-card" style="border-color: rgba(106,154,201,0.3);">
      <div class="head">
        <div class="name">一菜雙石+儲備</div>
        <div class="cat-pill" style="background:rgba(106,154,201,0.15);color:var(--blue);">EXPENSE</div>
      </div>
      <div class="last">
        上月: <span class="v num">${SNAP_DRAFT.prevKid != null ? fmtWan(SNAP_DRAFT.prevKid, {dp:2}) : '—'}</span> 萬
        ${SNAP_DRAFT.prevKid != null ? `<button class="copy" onclick="copyLastKid()">沿用</button>` : ''}
      </div>
      <div class="input-row">
        <input type="number" inputmode="decimal" step="any"

            if (diff < 0.01) {
              noteEl.style.color = 'var(--green)';
              noteEl.textContent = `✓ 公式驗證:期望 ${fmtWan(expected, {dp:4})} ≈ 實際 ${fmtWan(actual, {dp:4})}`;
            } else {
              noteEl.style.color = 'var(--red)';
              noteEl.textContent = `⚠ 公式不符:期望 ${fmtWan(expected, {dp:2})} vs 實際 ${fmtWan(actual, {dp:2})} (差 ${fmtWan(diff, {dp:2})})`;
            }
          }
        }
      }

      updateProgressBar();
      const card = e.target.closest('.input-card');
      if (v !== '' && !isNaN(parseFloat(v))) card.classList.add('entered');
      else card.classList.remove('entered');
      const note = card.querySelector('.auto-note');
      if (note && note.textContent.includes('攤還')) note.style.display = 'none';
    });
  });

  // QYLD input
  const qyldInp = document.getElementById('qyld-input');
  if (qyldInp) {
    qyldInp.addEventListener('input', (e) => {
      const v = e.target.value;
      SNAP_DRAFT.qyld_yield = v === '' ? null : parseFloat(v);
    });
  }
  const kidInp = document.getElementById('kid-input');
  if (kidInp) {
    kidInp.addEventListener('input', (e) => {
      const v = e.target.value;
      SNAP_DRAFT.monthly_kid_wan = v === '' ? null : parseFloat(v);
    });
  }
  const teslaInp = document.getElementById('tesla-input');
  if (teslaInp) {
    teslaInp.addEventListener('input', (e) => {
      const v = e.target.value;
      SNAP_DRAFT.tesla_pmt_wan = v === '' ? null : parseFloat(v);
    });
  }
}

  }
}

function saveSnapshot() {
  if (!SNAP_DRAFT) return;
  const idx = DATA.snapshots.findIndex(s => s.date === SNAP_DRAFT.date);
  const cleanBal = {};
  for (const [k, v] of Object.entries(SNAP_DRAFT.balances)) {
    if (v != null && !isNaN(v)) cleanBal[k] = v;
  }
  const snap = { date: SNAP_DRAFT.date, balances: cleanBal };
  if (SNAP_DRAFT.qyld_yield != null && !isNaN(SNAP_DRAFT.qyld_yield)) {
    snap.qyld_yield = SNAP_DRAFT.qyld_yield;
  }
  if (SNAP_DRAFT.monthly_kid_wan != null && !isNaN(SNAP_DRAFT.monthly_kid_wan)) {
    snap.monthly_kid_wan = SNAP_DRAFT.monthly_kid_wan;
  }
  if (SNAP_DRAFT.tesla_pmt_wan != null && !isNaN(SNAP_DRAFT.tesla_pmt_wan)) {
    snap.tesla_pmt_wan = SNAP_DRAFT.tesla_pmt_wan;
  }
  const wasEdit = SNAP_DRAFT.isEdit;
  if (idx >= 0) DATA.snapshots[idx] = snap;
  else DATA.snapshots.push(snap);
  saveData();
  SNAP_DRAFT = null;
  toast(wasEdit ? '資產表已更新 ✓' : '資產表已儲存 ✓');
  setTimeout(() => switchPage(wasEdit ? 'history' : 'dashboard'), 500);
}

// ============================================================
// 合併兩份資料(snapshots 以日期為鍵,新資料覆蓋舊資料)
// ============================================================
function mergeData(target, incoming) {
  // 合併 accounts:以 id 為鍵,incoming 優先(但保留 target 中 incoming 沒有的)
  const accMap = new Map();
  for (const a of target.accounts || []) accMap.set(a.id, a);
  for (const a of incoming.accounts || []) accMap.set(a.id, a);

  // 合併 snapshots:以 date 為鍵,incoming 覆蓋同日 target
  const snapMap = new Map();
  for (const s of target.snapshots || []) snapMap.set(s.date, s);
  for (const s of incoming.snapshots || []) snapMap.set(s.date, s);
  const snapshots = [...snapMap.values()].sort((a, b) => a.date.localeCompare(b.date));

  // settings:incoming 優先(若有)
  const settings = { ...(target.settings || {}), ...(incoming.settings || {}) };

  return {
    version: target.version || 2,
    settings,
    accounts: [...accMap.values()],
    snapshots,
  };
}

// ============================================================
// 載入內嵌歷史資料(合併到目前資料)
// ============================================================
function loadEmbeddedHistory() {
  const before = DATA.snapshots.length;
  const incomingCount = EMBEDDED_HISTORY.snapshots.length;
  const willHave = (() => {
    const dates = new Set(DATA.snapshots.map(s => s.date));
    EMBEDDED_HISTORY.snapshots.forEach(s => dates.add(s.date));
    return dates.size;
  })();
  const overlap = before + incomingCount - willHave;

  let msg = `載入內嵌歷史資料\n\n`;
  msg += `目前: ${before} 筆\n`;
  msg += `內嵌: ${incomingCount} 筆\n`;
  if (overlap > 0) msg += `重疊: ${overlap} 筆(會被覆蓋)\n`;
  msg += `合併後: ${willHave} 筆\n\n繼續?`;

  if (!confirm(msg)) return;

  DATA = mergeData(DATA, EMBEDDED_HISTORY);
  saveData();
  renderAll();
  toast(`已合併 ${incomingCount} 筆歷史 (現共 ${willHave} 筆)`);
}

// ============================================================
// 匯出 JSON(含合併後完整資料)
// ============================================================
function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ledger-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`已匯出 ${DATA.snapshots.length} 筆快照`);
}

// ============================================================
// 匯入 JSON:讓使用者選擇「合併」或「覆蓋」
// ============================================================
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const obj = JSON.parse(await file.text());
      if (!obj.accounts || !obj.snapshots) throw new Error('format');

      const incomingCount = obj.snapshots.length;
      const choice = confirm(
        `匯入 ${incomingCount} 筆快照\n\n` +
        `[確定] = 合併到目前資料(同日期會覆蓋)\n` +
        `[取消] = 不匯入\n\n` +
        `若要完全覆蓋,請先用「清空」按鈕清除資料再匯入。`
      );
      if (!choice) return;

      DATA = mergeData(DATA, obj);
      saveData(); renderAll();
      toast(`已合併 ${incomingCount} 筆 (現共 ${DATA.snapshots.length} 筆)`);
    } catch (err) { alert('檔案格式錯誤'); }
  };
  inp.click();
}

// ============================================================
// 清空資料(回到空白)
// ============================================================
function resetData() {
  if (!confirm('將清空所有快照(保留帳戶結構),確定?\n\n建議先匯出 JSON 備份')) return;
  // 重置 snapshots 但保留 accounts(因為使用者可能新增過自訂帳戶)
  DATA = {
    ...DATA,
    snapshots: [],
  };
  saveData(); renderAll(); toast('已清空');
}

      <b style="color:var(--ink);">匯入</b>:採「合併」方式,同日期會被新檔覆蓋,其他保留<br>
      <b style="color:var(--ink);">清空</b>:清除所有快照(帳戶結構保留)
    </div>
    <div class="info-box">
      <strong>備份很重要</strong><br>
      資料只存在這個瀏覽器裡。每月儲存快照後,順手到「設定 → 匯出 JSON」存一份到 iCloud/Dropbox。
    </div>
    <div class="modal-actions">
      <button class="ok" onclick="closeModal()" style="flex:1;">了解</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('show');
}

// ============================================================
// PAGE NAV
// ============================================================
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === name));
  window.scrollTo(0, 0);
  if (name === 'dashboard') renderDashboard();
  if (name === 'history') renderHistory();
  if (name === 'custodial') renderCustodial();
  if (name === 'settings') renderSettings();
}

function renderAll() {
  renderDashboard(); renderHistory(); renderCustodial(); renderSettings();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// INIT
function initApp() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchPage(t.dataset.page));
  });
  document.getElementById('modal-bg').addEventListener('click', (e) => {
    if (e.target.id === 'modal-bg') closeModal();
  });
  document.getElementById('btn-help').addEventListener('click', openHelpModal);
  renderAll();
}

// 啟動流程:先檢查是否已登入
if (isLoggedIn()) {
  document.getElementById('login-overlay').classList.add('hidden');
  initApp();
} else {
  showLoginGate();
}
</script>
</body>
</html>
